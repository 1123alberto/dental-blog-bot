name: Weekly Dental Blog Bot

on:
  schedule:
    - cron: '0 7 * * 1'  # 7:00 AM UTC every Monday (approx 9:00 AM Greece time)
  workflow_dispatch:     # Allows manual triggering from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Bot Repository
        uses: actions/checkout@v4
        with:
          path: bot # Checkout bot code into './bot' folder

      - name: Checkout Website Repository
        uses: actions/checkout@v4
        with:
          repository: '1123alberto/dentplant-new'
          token: ${{ secrets.WEBSITE_PUSH_PAT }} # Secure token to write to dentplant-new
          path: website # Checkout website code into './website' folder
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: bot/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Run Dental Blog Bot
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          WEBSITE_PATH: "./website" # Save outputs to the website checkout folder
        run: python bot/main.py

      - name: Publish website changes or open clinical-review PR
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_PUSH_PAT }}
        run: |
          action="$(jq -r '.publication_action // "none"' bot/output/weekly_decision.json)"
          cd website
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          case "$action" in
            direct_publish)
              git add .
              git commit -m "Automated: New weekly dental blog post" || echo "No changes to commit"
              git push origin master
              ;;
            clinical_review_pr)
              branch="$(jq -r '.review_branch // empty' ../bot/output/weekly_decision.json)"
              title="$(jq -r '.draft_pr_title // empty' ../bot/output/weekly_decision.json)"
              body_file="$RUNNER_TEMP/clinical-review-pr.md"
              jq -r '.draft_pr_body // empty' ../bot/output/weekly_decision.json > "$body_file"
              if ! [[ "$branch" =~ ^clinical-review/blog-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$ ]] || [ -z "$title" ] || [ ! -s "$body_file" ]; then
                echo "Malformed clinical-review handoff metadata; refusing to publish."
                exit 1
              fi
              existing_pr="$(gh pr list --repo 1123alberto/dentplant-new --state open --base master --head "$branch" --json url --jq '.[0].url // empty')"
              if [ -n "$existing_pr" ]; then
                echo "Reusing existing clinical-review PR: $existing_pr"
                exit 0
              fi
              if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
                echo "Review branch exists without an open PR; refusing to overwrite it."
                exit 1
              fi
              git switch -c "$branch"
              git add .
              if git diff --cached --quiet; then
                echo "Clinical-review handoff has no website changes; refusing ambiguous PR creation."
                exit 1
              fi
              git commit -m "Clinical review: $title"
              git push -u origin "$branch"
              gh pr create --repo 1123alberto/dentplant-new --draft --base master --head "$branch" --title "$title" --body-file "$body_file"
              ;;
            none)
              echo "No website publication required for this weekly decision."
              ;;
            *)
              echo "Unknown publication action '$action'; refusing website publication."
              exit 1
              ;;
          esac

      - name: Commit and Push Changes to Bot Repository
        run: |
          cd bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Automated: Sync new blog post, posts_backup.json, and GMB assets to output folder" || echo "No changes to commit"
          git push origin main
